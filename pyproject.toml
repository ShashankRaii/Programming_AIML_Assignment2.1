[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute"
version = "0.1.0"
description = "A modular, vectorised scientific computing toolkit built on NumPy."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter"]

[tool.setuptools]
packages = ["numcompute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"